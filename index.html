<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;line-height:1.5}img{max-width:100%}[hidden]{display:none!important}</style>
<title>星空單字冒險</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：置中單欄，星空背景＋金框題目卡；刻意固定為夜空主題 */
:root{color-scheme:dark;--bg:#0b0a2a;--panel:#1b1856;--line:#5b54c9;--fg:#f6f4ff;--dim:#bdb8ee;--gold:#ffd35c;--gold2:#ff9f45;--cyan:#55e6ff;--pink:#ff6fcf;--ok:#24c98b;--no:#f0476a;--ink:#1a1040;
--en:'Fredoka','Trebuchet MS',sans-serif;--zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
body{background:radial-gradient(ellipse at 20% 0%,#3b2a8c 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#6a1f7a 0%,transparent 50%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--zh);min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{max-width:760px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
h1{margin:18px 0 4px;text-align:center;font-weight:900;font-size:clamp(2.1rem,9vw,3.8rem);letter-spacing:.06em;background:linear-gradient(100deg,var(--gold) 20%,#fff 40%,var(--pink) 60%,var(--cyan) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #8a6bff99);animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sub{text-align:center;color:var(--dim);margin:0 0 24px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.level{padding:24px 18px;border-radius:24px;background:linear-gradient(160deg,#2b2780,#17144a);border:2px solid var(--c);box-shadow:0 0 26px -6px var(--c),inset 0 0 30px -18px var(--c);transition:transform .2s;text-align:center}
.level:hover{transform:translateY(-6px) scale(1.02)}
.level svg{width:76px;height:76px;fill:var(--c);filter:drop-shadow(0 0 12px var(--c))}
.level b{display:block;font-size:1.7rem;font-weight:900;margin:6px 0}
.level span{display:block;color:var(--dim);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:22px 0 0}
.chip{padding:8px 18px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:900}
.big{padding:13px 28px;border-radius:99px;font-weight:900;font-size:1.1rem;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 5px 0 #a85a12,0 0 24px #ffb44d77}
.big:active{transform:translateY(3px)}
.hud{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.hud .score{color:var(--gold);font-size:1.3rem}
.bar{height:12px;border-radius:9px;background:#ffffff1c;margin:12px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));transition:width .35s}
.card{position:relative;text-align:center;padding:30px 14px 24px;border-radius:28px;border:3px solid transparent;background:linear-gradient(#1d1a5e,#14123f) padding-box,linear-gradient(135deg,var(--gold),var(--pink),var(--cyan),var(--gold)) border-box;box-shadow:0 0 40px -4px #8a6bffaa}
.word{text-wrap:balance;font-family:var(--en);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1.15;overflow-wrap:anywhere;text-shadow:0 0 22px #55e6ffaa}
.say{margin-top:8px;padding:6px 18px;border-radius:99px;background:#ffffff18}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.opt{display:flex;align-items:center;gap:10px;min-width:0;min-height:76px;padding:12px;border-radius:20px;background:linear-gradient(180deg,#3a35a0,#26226f);border:2px solid #7a72e8;box-shadow:0 6px 0 #100d38;font-size:clamp(1.1rem,4.8vw,1.55rem);font-weight:700;text-align:left}
.opt kbd{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font:700 1rem var(--en)}
.opt:not(:disabled):hover{transform:translateY(-3px);border-color:var(--cyan)}
.opt:disabled{cursor:default;opacity:.5}
.opt.ok{opacity:1;background:var(--ok);border-color:#b6ffe0;color:#04261a;box-shadow:0 0 30px var(--ok);animation:pop .4s}
.opt.no{opacity:1;background:var(--no);border-color:#ffc2cf;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.msg{min-height:2em;margin:20px 0 6px;text-align:center;font-weight:900;font-size:1.25rem;color:var(--gold)}
.center{text-align:center}
.stars{font-size:3.4rem;color:var(--gold);letter-spacing:.1em;text-shadow:0 0 24px #ffb44d}
.final{font:700 4rem var(--en);color:var(--cyan)}
ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left}
li b{font-family:var(--en);font-size:1.2rem;color:var(--cyan);display:block}
.note{margin-top:30px;text-align:center;color:var(--dim);font-size:.82rem}
@media(max-width:480px){.opts{grid-template-columns:1fr}.opt{min-height:62px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

if(NAMES[g.lv]&&!g.gr)store.set('best425-'+g.lv,Math.max(g.score,store.get('best425-'+g.lv,0)));
app.innerHTML=`<div class="center"><h1>闖關完成</h1><div class="stars" aria-label="${s} 顆星">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="final">${g.score}</div><p>答對 ${g.right} / ${g.list.length} 題</p>
<div class="row"><button class="big" id="again">再玩一次</button><button class="chip" id="back">回首頁</button></div>
${g.miss.length?`<h2>再記一次</h2><ul>${g.miss.map(q=>`<li><b>${q[0]}</b>${q[1]}</li>`).join('')}</ul>`:'<h2>全部答對！</h2>'}</div>`;
document.getElementById('again').onclick=()=>start(g.lv,g.pool,g.gr);document.getElementById('back').onclick=home;
if(s>=2){tone([523,659,784,1047,1319]);for(let k=0;k<4;k++)setTimeout(()=>burst(innerWidth*(.2+.2*k),innerHeight*.3,70),k*250)}}
addEventListener('keydown',e=>{if(G&&!e.repeat&&'1234'.includes(e.key)&&e.key.length===1)answer(+e.key-1)});
const cv=document.getElementById('fx'),cx=cv.getContext('2d'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let parts=[],stars=[];
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);stars=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.3,p:Math.random()*7}))}
function burst(x,y,n){if(calm)return;const C=['#ffd35c','#55e6ff','#ff6fcf','#fff','#24c98b'];for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*7+2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:C[i%5],r:Math.random()*4+2})}}
function draw(t){cx.clearRect(0,0,innerWidth,innerHeight);cx.fillStyle='#fff';for(const s of stars){cx.globalAlpha=calm?.5:.25+.4*Math.abs(Math.sin(t/900+s.p));cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()}
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.018;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
cx.globalAlpha=1;if(!calm)requestAnimationFrame(draw)}
addEventListener('resize',()=>{size();if(calm)draw(0)});size();requestAnimationFrame(draw);home();
</script>
